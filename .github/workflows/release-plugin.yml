name: Release plugin

# Builds aiaddon.plugin from adapters/claude (the shipped plugin) when a v* tag is pushed, plus one <skill>.zip per skill,
# the Prompt Builder prompt and SHA256SUMS, signs build provenance, and attaches everything to the GitHub release.
# One-click download: https://github.com/syncwin/aiaddon/releases/latest/download/aiaddon.plugin
# Verify a download:  gh attestation verify aiaddon.plugin --repo syncwin/aiaddon
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, for example v0.3.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-plugin-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  release:
    name: Build, attest, attach aiaddon.plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create or update the release and attach files
      id-token: write # sign the build provenance
      attestations: write # store the provenance attestation
    env:
      NAME: "AI Add-on Builder"
      ASSET: aiaddon.plugin
      ROOT: adapters/claude
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0  # full history for the secret scan
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check the tag matches the plugin version
        id: version
        run: |
          v=$(python -c "import json,os;print(json.load(open(os.environ['ROOT'] + '/.claude-plugin/plugin.json'))['version'])")
          test "$TAG" = "v$v" || { echo "tag $TAG does not match plugin version $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Run every check
        run: |
          python dev/aiaddon-review/scripts/selftest.py
          python dev/aiaddon-review/scripts/validate_extension.py "$ROOT" --strict --target directory --require-meta author,company
          python dev/aiaddon-review/scripts/scan_secrets.py .
          python dev/aiaddon-review/scripts/scan_secrets.py . --history
          python dev/aiaddon-review/scripts/route_check.py "$ROOT"
          python dev/aiaddon-review/scripts/screen_text.py "$ROOT"
      - name: Build the package
        run: |
          # package_extension leaves out dev/, evals/, prompts/, .github/, .claude/, IMPROVEMENTS.md and .public-safety-allow.
          python dev/aiaddon-package/scripts/package_extension.py "$ROOT" --format plugin --out dist --repo "$GITHUB_REPOSITORY" --force
          python dev/aiaddon-package/scripts/build_skill_zips.py "$ROOT" --out dist
          cd dist
          mv -- "$(ls -- *.plugin | head -1)" "$ASSET"
          rm -f -- *" install.md"
          python - <<'PY'
          import os, zipfile
          names = zipfile.ZipFile(os.environ["ASSET"]).namelist()
          text_ext = {".md", ".json", ".yaml", ".yml", ".txt", ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico"}
          text_names = {"LICENSE", ".gitignore"}
          assert ".claude-plugin/plugin.json" in names, "plugin.json missing at the package root"
          bad = [n for n in names if os.path.splitext(n)[1].lower() not in text_ext and os.path.basename(n) not in text_names]
          assert not bad, "files the directory refuses: " + ", ".join(bad)
          assert not [n for n in names if n.split("/")[0] in ("hooks", "scripts", "dev", "evals", "prompts") or os.path.basename(n) in (".public-safety-allow", "IMPROVEMENTS.md")], "maintainer files or hooks in the package"
          print("package ok:", len(names), "files")
          PY
          sha256sum -- "$ASSET" ai-add-on-builder.json *.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Scan the built packages for secrets and private data (blocking)
        run: python dev/aiaddon-review/scripts/scan_secrets.py . --artifacts dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/${{ env.ASSET }}
            dist/ai-add-on-builder.json
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" ai-add-on-builder.json SHA256SUMS *.zip --clobber
          else
            gh release create "$TAG" "$ASSET" ai-add-on-builder.json SHA256SUMS *.zip --title "$NAME $TAG" --generate-notes --verify-tag
          fi
