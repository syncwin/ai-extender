name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  checks:
    name: Checks (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) has no Python 3.9
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Self-test the scripts
        run: python dev/aiaddon-review/scripts/selftest.py
      - name: Validate the shipped plugin for the Claude plugin directory (adapters/claude)
        run: python dev/aiaddon-review/scripts/validate_extension.py adapters/claude --strict --target directory --require-meta author,company
      - name: Scan for plain-text secrets
        run: python dev/aiaddon-review/scripts/scan_secrets.py .
      - name: Screen docs for prompt injection
        run: python dev/aiaddon-review/scripts/screen_text.py adapters/claude
      - name: Check the router against its evals
        run: python dev/aiaddon-review/scripts/route_check.py adapters/claude
      - name: Simulate skill triggers
        run: python dev/aiaddon-review/scripts/simulate.py adapters/claude triggers
      - name: Self-test as a non-root user
        if: matrix.python == '3.13'
        run: test "$(id -u)" != 0 && python dev/aiaddon-review/scripts/selftest.py | grep -q "PASS read-only source is staged, not written"

  public-safety:
    name: Public safety (secrets and private data)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history: a key deleted last week is still in it
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Scan the working tree and the full git history (blocking)
        run: python dev/aiaddon-review/scripts/scan_secrets.py . --history
      - name: Scan built packages, when present (blocking)
        run: |
          python dev/aiaddon-package/scripts/build_skill_zips.py adapters/claude --out "$RUNNER_TEMP/skill-zips"
          python dev/aiaddon-review/scripts/scan_secrets.py . --artifacts "$RUNNER_TEMP/skill-zips"
